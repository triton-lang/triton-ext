# Anchor pytest's rootdir at the repository root so the top-level `conftest.py`
# (which collects lit-style `.mlir` tests) is always loaded, even when running
# `pytest test/` from within an extension that ships its own `pyproject.toml`.
[tool.pytest.ini_options]
minversion = "8.0"
# Test collection is whitelisted to enabled extensions' `test/` dirs plus the
# repo-level `testing/` suite (see `conftest.py`), so a disabled `utlx` is
# already pruned. This ignore stays correct if utlx is re-enabled: its `tlx`
# tree is a vendored upstream TLX checkout with its own `*_test.py` files
# (imported at module scope, requiring torch/GPU) that are not part of this
# repo's suite -- utlx runs only `pytest test/`.
addopts = "--ignore=extensions/utlx/tlx"
