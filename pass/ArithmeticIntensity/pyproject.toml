[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.20", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "triton-arithmetic-intensity"
version = "0.1.0"
description = "ArithmeticIntensity: a Triton pass distributed as a Plugin"
requires-python = ">=3.9"

[tool.triton-ext]
status = "experimental"
enabled = true

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
# Keep caches out of the wheel.
wheel.exclude = ["**/__pycache__/**", "**/*.pyc"]

# Bundle the pure-Python package. CMake installs libarithmetic_intensity.so into
# triton_arithmetic_intensity/ using `install()` (see CMakeLists.txt).
[tool.scikit-build.wheel.packages]
triton_arithmetic_intensity = "python/triton_arithmetic_intensity"
