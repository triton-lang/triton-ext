default_stages: [pre-commit, pre-push, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: trailing-whitespace
        # Vendored verbatim; two files ship without a final newline.
        exclude: '^extensions/utlx/(examples/kda_prefill/(?!run\.py$)|test/tlx_ops/test_kda_gfx950\.py$)'
      - id: end-of-file-fixer
        # Vendored verbatim; two files ship without a final newline.
        exclude: '^extensions/utlx/(examples/kda_prefill/(?!run\.py$)|test/tlx_ops/test_kda_gfx950\.py$)'
      - id: check-yaml
      - id: check-toml
      - id: check-ast
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        # Vendored verbatim; upstream ships this mode.
        exclude: '^extensions/utlx/(examples/kda_prefill/(?!run\.py$)|test/tlx_ops/test_kda_gfx950\.py$)'
      - id: detect-private-key
      - id: debug-statements

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--wrap, "80"]
        files: '.*\.(md|txt)$'
        additional_dependencies: [mdformat-gfm]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        language_version: lts
        args: [--config, .markdownlint-cli]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        # Vendored verbatim from sglang; see examples/kda_prefill/README.md.
        exclude: '^extensions/utlx/(examples/kda_prefill/(?!run\.py$)|test/tlx_ops/test_kda_gfx950\.py$)'

  - repo: https://github.com/google/yapf
    rev: "v0.43.0"
    hooks:
      - id: yapf
        args: ["-p", "-i"]
        exclude: '^extensions/utlx/(examples/kda_prefill/(?!run\.py$)|test/tlx_ops/test_kda_gfx950\.py$)'

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.15.0"
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        exclude: '^extensions/utlx/(test/|examples/kda_prefill/)'

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.6
    hooks:
      - id: clang-format

  - repo: local
    hooks:
      - id: check-extensions
        name: check extension manifests
        entry: ci/list_extensions.py
        language: python
        pass_filenames: false
      - id: doctests
        name: run doctests
        entry: ci/doctests.py
        language: python
        additional_dependencies: [requests]
        pass_filenames: false

exclude: '^$'
